name: Production deploy (Vercel)

# Déclenchement manuel. Déploie la branche courante en PRODUCTION sur Vercel avec le seul secret
# VERCEL_TOKEN : crée ou relie le projet, pousse les variables d'environnement (valeurs jamais
# affichées), applique les migrations Prisma (`migrate deploy` uniquement), construit, déploie,
# puis vérifie l'URL publique (pages publiques en 200, endpoint de santé).
# Sans VERCEL_TOKEN ou DATABASE_URL : SKIPPED — SECRET NOT CONFIGURED.
on:
  workflow_dispatch:
    inputs:
      project:
        description: "Nom du projet Vercel"
        default: "alternance-os"
        required: false

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Projet → variables → migrations → build → déploiement → vérification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_VERSION: "22"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PROJECT: ${{ inputs.project || 'alternance-os' }}
    steps:
      - name: Vérifier la présence des secrets (valeurs jamais affichées)
        id: check
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DB: ${{ secrets.DATABASE_URL }}
        run: |
          missing=""
          [ -z "$TOKEN" ] && missing="$missing VERCEL_TOKEN"
          [ -z "$DB" ] && missing="$missing DATABASE_URL"
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "SKIPPED — SECRET NOT CONFIGURED ($missing)"
            printf '## Production deploy — ⚪ NOT CONFIGURED\n\nSecrets manquants :%s (GitHub repository → Settings → Secrets and variables → Actions).\n' "$missing" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.configured == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.configured == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Installer les dépendances et la CLI Vercel
        if: steps.check.outputs.configured == 'true'
        run: |
          npm ci
          npm install --no-save vercel@latest

      - name: Créer ou relier le projet Vercel
        if: steps.check.outputs.configured == 'true'
        id: project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx vercel project add "$PROJECT" --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
          npx vercel link --yes --project "$PROJECT" --token "$VERCEL_TOKEN"
          ORG_ID=$(node -e 'console.log(require("./.vercel/project.json").orgId)')
          PROJECT_ID=$(node -e 'console.log(require("./.vercel/project.json").projectId)')
          echo "::add-mask::$ORG_ID"
          echo "::add-mask::$PROJECT_ID"
          echo "org_id=$ORG_ID" >> "$GITHUB_OUTPUT"
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          pick() { node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{const j=JSON.parse(d);const list=(j.domains||[]).map(x=>x.name);console.log(list.find(n=>n.endsWith(".vercel.app"))||list[0]||"")}catch{console.log("")}})'; }
          # Compte personnel (orgId = identifiant utilisateur) ou équipe : on tente sans puis avec teamId.
          api() { curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" -H "content-type: application/json" "$@"; }
          # Un projet créé en CLI n'a pas de preset : sans « nextjs », le build est servi comme un site statique (404 partout).
          FW=$(api -X PATCH "https://api.vercel.com/v9/projects/$PROJECT_ID" -d '{"framework":"nextjs"}' | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log(JSON.parse(d).framework||"")}catch{console.log("")}})')
          if [ "$FW" != "nextjs" ]; then FW=$(api -X PATCH "https://api.vercel.com/v9/projects/$PROJECT_ID?teamId=$ORG_ID" -d '{"framework":"nextjs"}' | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log(JSON.parse(d).framework||"")}catch{console.log("")}})'); fi
          echo "Preset du projet : ${FW:-non modifié (vercel.json fait foi)}"
          DOMAIN=$(api "https://api.vercel.com/v9/projects/$PROJECT_ID/domains" | pick)
          if [ -z "$DOMAIN" ]; then DOMAIN=$(api "https://api.vercel.com/v9/projects/$PROJECT_ID/domains?teamId=$ORG_ID" | pick); fi
          if [ -z "$DOMAIN" ]; then DOMAIN="$PROJECT.vercel.app"; fi
          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"
          echo "Domaine de production : https://$DOMAIN"

      - name: Pousser les variables d'environnement de production (valeurs jamais affichées)
        if: steps.check.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ steps.project.outputs.org_id }}
          VERCEL_PROJECT_ID: ${{ steps.project.outputs.project_id }}
          DOMAIN: ${{ steps.project.outputs.domain }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FRANCE_TRAVAIL_CLIENT_ID: ${{ secrets.FRANCE_TRAVAIL_CLIENT_ID }}
          FRANCE_TRAVAIL_CLIENT_SECRET: ${{ secrets.FRANCE_TRAVAIL_CLIENT_SECRET }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
        run: |
          set -e
          existing=$(npx vercel env ls production --token "$VERCEL_TOKEN" 2>/dev/null || true)
          has() { echo "$existing" | grep -qE "^[[:space:]]*$1[[:space:]]"; }
          upsert() { # name value : remplace la valeur de production (jamais affichée)
            if has "$1"; then npx vercel env rm "$1" production --yes --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true; fi
            printf '%s' "$2" | npx vercel env add "$1" production --token "$VERCEL_TOKEN" >/dev/null
            echo "  $1 : défini"
          }
          keep_or_generate() { # name secret : conserve la valeur Vercel existante, sinon le secret GitHub, sinon génère une valeur aléatoire persistée dans Vercel
            if [ -n "$2" ]; then upsert "$1" "$2"
            elif has "$1"; then echo "  $1 : conservé (déjà défini dans Vercel)"
            else upsert "$1" "$(openssl rand -base64 48 | tr -d '\n=/+' | cut -c1-48)"; fi
          }
          upsert DATABASE_URL "$DATABASE_URL"
          upsert NEXT_PUBLIC_APP_URL "https://$DOMAIN"
          upsert BETTER_AUTH_URL "https://$DOMAIN"
          keep_or_generate BETTER_AUTH_SECRET "$BETTER_AUTH_SECRET"
          keep_or_generate CRON_SECRET "$CRON_SECRET"
          upsert DEMO_MODE "false"
          upsert NEXT_PUBLIC_DEMO_MODE "false"
          upsert COMPANY_DATA_PROVIDER "recherche-entreprises"
          upsert TRAVEL_TIME_PROVIDER "none"
          if [ -n "$FRANCE_TRAVAIL_CLIENT_ID" ] && [ -n "$FRANCE_TRAVAIL_CLIENT_SECRET" ]; then
            upsert FRANCE_TRAVAIL_CLIENT_ID "$FRANCE_TRAVAIL_CLIENT_ID"
            upsert FRANCE_TRAVAIL_CLIENT_SECRET "$FRANCE_TRAVAIL_CLIENT_SECRET"
          fi
          if [ -n "$ADMIN_EMAILS" ]; then upsert ADMIN_EMAILS "$ADMIN_EMAILS"; fi

      - name: Appliquer les migrations (prisma migrate deploy, connexion directe, 3 tentatives)
        if: steps.check.outputs.configured == 'true'
        env:
          POOLED_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ci-migration-placeholder-not-a-secret
        run: |
          # Le verrou consultatif de Prisma Migrate ne traverse pas un pooler en mode transaction (Neon « -pooler ») :
          # les migrations passent par l'hôte direct (même identifiants), la valeur n'est jamais affichée.
          export DATABASE_URL="${POOLED_URL/-pooler./.}"
          for i in 1 2 3; do
            if npx prisma migrate deploy; then exit 0; fi
            echo "Tentative $i échouée, nouvelle tentative dans 15 s…"; sleep 15
          done
          exit 1

      - name: Déployer en production (build exécuté chez Vercel)
        if: steps.check.outputs.configured == 'true'
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ steps.project.outputs.org_id }}
          VERCEL_PROJECT_ID: ${{ steps.project.outputs.project_id }}
          DOMAIN: ${{ steps.project.outputs.domain }}
        run: |
          set -e
          # Les variables de type « Secret » ne peuvent pas être tirées localement (`vercel pull` écrit
          # [SENSITIVE]) : le build doit donc s'exécuter chez Vercel, où elles sont disponibles.
          URL=$(npx vercel deploy --prod --yes --token "$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Déploiement : $URL"
          HOST=${URL#https://}
          aliases() { node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{const j=JSON.parse(d);console.log((j.alias||[]).join(" "))}catch{console.log("")}})'; }
          ALIASES=$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/$HOST" | aliases)
          if [ -z "$ALIASES" ]; then ALIASES=$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/$HOST?teamId=$VERCEL_ORG_ID" | aliases); fi
          echo "Alias de production : ${ALIASES:-aucun}"
          PUBLIC="$DOMAIN"
          case " $ALIASES " in
            *" $DOMAIN "*) ;;
            *) for a in $ALIASES; do case "$a" in *.vercel.app) if [ "$PUBLIC" = "$DOMAIN" ] || [ ${#a} -lt ${#PUBLIC} ]; then PUBLIC="$a"; fi ;; esac; done ;;
          esac
          echo "public_domain=$PUBLIC" >> "$GITHUB_OUTPUT"
          if [ "$PUBLIC" != "$DOMAIN" ]; then
            echo "Domaine public réel : https://$PUBLIC (différent de $DOMAIN) → mise à jour de NEXT_PUBLIC_APP_URL / BETTER_AUTH_URL puis redéploiement."
            for name in NEXT_PUBLIC_APP_URL BETTER_AUTH_URL; do
              npx vercel env rm "$name" production --yes --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
              printf '%s' "https://$PUBLIC" | npx vercel env add "$name" production --token "$VERCEL_TOKEN" >/dev/null
            done
            URL=$(npx vercel deploy --prod --yes --token "$VERCEL_TOKEN")
            echo "url=$URL" >> "$GITHUB_OUTPUT"
            echo "Redéploiement : $URL"
          fi
          echo "URL publique : https://$PUBLIC"

      - name: Vérifier l'URL publique (pages en 200, santé)
        if: steps.check.outputs.configured == 'true'
        env:
          DOMAIN: ${{ steps.deploy.outputs.public_domain }}
        run: |
          BASE="https://$DOMAIN"
          sleep 15
          fail=0
          {
            echo "## Production deploy"
            echo
            echo "URL : $BASE"
            echo
            echo "| Page | HTTP | Redirection |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for p in / /jobs "/jobs?q=d%C3%A9veloppeur&city=Nantes&radius=30" /companies /radar /map /compare /favorites /dashboard /sources /api/health; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 "$BASE$p")
            redirect=$(curl -sS -o /dev/null -w '%{redirect_url}' --max-time 60 "$BASE$p")
            echo "| $p | $code | ${redirect:-—} |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$code" != "200" ]; then echo "::error::$p → HTTP $code"; fail=1; fi
            case "$redirect" in *login*|*register*) echo "::error::$p redirige vers la connexion"; fail=1 ;; esac
          done
          HEALTH=$(curl -sS --max-time 60 "$BASE/api/health")
          echo "$HEALTH" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{const h=JSON.parse(d);console.log(JSON.stringify({app:h.app,database:h.database,demoMode:h.demoMode,services:h.services,data:h.data},null,2))})' | tee health.json
          printf '\n```json\n' >> "$GITHUB_STEP_SUMMARY"; cat health.json >> "$GITHUB_STEP_SUMMARY"; printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          node -e 'const h=JSON.parse(require("fs").readFileSync("health.json","utf8")); if(h.database!=="healthy"||h.demoMode!==false){console.error("Santé insuffisante");process.exit(1)}'
          exit $fail
